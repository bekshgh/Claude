name: CI

on:
  push:
  pull_request:

jobs:
  utm-tracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utm-tracker
    env:
      # The build never connects to the database; Prisma only needs well-formed URLs.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: utm-tracker/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npx next build
